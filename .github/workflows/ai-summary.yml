name: AI Summary

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

permissions:
    contents: read

jobs:
    summarize:
        name: Generate AI Summary
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Gather changed files
              id: changed-files
              run: |
                  echo "files<<EOF" >> "$GITHUB_OUTPUT"
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                      git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT" || true
                  else
                      if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                          git diff --name-only HEAD~1 HEAD >> "$GITHUB_OUTPUT" || true
                      else
                          git ls-files >> "$GITHUB_OUTPUT" || true
                      fi
                  fi
                  echo "EOF" >> "$GITHUB_OUTPUT"

            - name: Report summary
              run: |
                  echo "Changed files for ${{ github.event_name }}:"
                  echo "${{ steps.changed-files.outputs.files }}"
