name: Bug Report

on:
    issues:
        types: [opened, reopened, labeled]

permissions:
    issues: write

jobs:
    triage:
        name: Triage Bug Report
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: |
            contains(github.event.issue.labels.*.name, 'bug') &&
            !contains(github.event.issue.labels.*.name, 'triage')
        steps:
            - name: Triage and acknowledge bug report
              uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.issues.addLabels({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          labels: ["triage"]
                      });

                      await github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: "Thank you for reporting this issue! A maintainer will triage this shortly. If you haven't already, please provide a minimal reproduction or relevant configuration snippets."
                      });
